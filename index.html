<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Certificación de Poda - EPEC</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e3a8a">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans pb-20">

  <!-- Header -->
  <header class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-40 flex items-center justify-between shadow-lg">
    <div class="flex items-center space-x-3">
      <button id="btn-back" class="hidden p-2 text-slate-400 hover:text-white bg-slate-700/50 rounded-lg">
        <i data-lucide="arrow-left" class="w-5 h-5"></i>
      </button>
      <div>
        <h1 class="text-base font-bold text-white leading-tight">Certificación de Poda 2.4</h1>
        <p id="sub-header" class="text-xs text-slate-400">EPEC - Cuadrillas Privadas (Modo Offline)</p>
      </div>
    </div>
    <div class="flex items-center space-x-2">
      <span id="offline-badge" class="hidden px-2 py-0.5 rounded text-[10px] font-bold bg-amber-950 text-amber-300 border border-amber-600/50">OFFLINE</span>
      <button onclick="cargarDatosActuales()" class="p-2 text-slate-400 hover:text-white">
        <i data-lucide="refresh-cw" class="w-4 h-4"></i>
      </button>
    </div>
  </header>

  <!-- Contenido -->
  <main class="flex-1 p-4 max-w-lg mx-auto w-full">

    <!-- VISTA 1: SELECCIÓN DE TRAMO -->
    <section id="vista-tramos" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Zona Seleccionada</label>
        <select id="select-zona" onchange="cargarTramos()" class="w-full bg-slate-800 border border-slate-700 text-white rounded-xl p-3 text-sm outline-none">
          <!-- Las zonas se cargarán dinámicamente -->
        </select>
      </div>

      <div class="flex items-center justify-between pt-2">
        <h2 class="text-sm font-semibold text-slate-300">Tramos de Línea (<span id="count-tramos">0</span>)</h2>
      </div>

      <div id="lista-tramos" class="space-y-3"></div>
    </section>

    <!-- VISTA 2: LISTA DE VANOS DE UN TRAMO -->
    <section id="vista-vanos" class="hidden space-y-4">
      <!-- Tarjeta resumen -->
      <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4 shadow-md space-y-3">
        <div>
          <span id="tramo-linea-tag" class="text-xs font-semibold text-blue-400 uppercase tracking-wider block"></span>
          <h2 id="tramo-titulo" class="text-base font-bold text-white"></h2>
        </div>

        <div class="space-y-1">
          <div class="flex justify-between text-xs text-slate-400">
            <span>Progreso de Certificación</span>
            <span id="tramo-progreso-txt" class="font-bold text-white">0%</span>
          </div>
          <div class="w-full bg-slate-700 h-2.5 rounded-full overflow-hidden">
            <div id="bar-certificados" class="bg-emerald-500 h-full transition-all duration-300" style="width: 0%"></div>
          </div>
        </div>

        <!-- BOTÓN ACTUALIZAR TRAMO -->
        <button id="btn-actualizar-tramo" onclick="actualizarTramoServidor()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-4 rounded-xl shadow-lg shadow-blue-600/30 flex items-center justify-center space-x-2 transition active:scale-95">
          <i data-lucide="save" class="w-5 h-5"></i>
          <span>ACTUALIZAR TRAMO EN HOJA</span>
        </button>
      </div>

      <!-- TARJETA DE ACCESOS, CONTACTOS Y OT -->
      <div class="bg-slate-800/90 border border-slate-700 rounded-2xl p-4 shadow-md space-y-3">
        <div class="flex items-center justify-between cursor-pointer" onclick="toggleSeccionAccesos()">
          <div class="flex items-center space-x-2 text-amber-400 font-bold text-xs uppercase">
            <i data-lucide="key" class="w-4 h-4"></i>
            <span>Accesos, Candados, Contactos y OT</span>
          </div>
          <i id="icono-toggle-accesos" data-lucide="chevron-down" class="w-4 h-4 text-slate-400 transition-transform"></i>
        </div>
        <div id="contenedor-accesos" class="hidden space-y-3 pt-2 border-t border-slate-700">
          <div id="lista-accesos-contenido" class="space-y-2 text-xs text-slate-300">
            <p class="text-slate-500 italic">Cargando datos de accesos y OT...</p>
          </div>
        </div>
      </div>

      <!-- Barra de herramientas -->
      <div class="flex items-center justify-between pt-2">
        <div class="flex space-x-1 overflow-x-auto text-xs no-scrollbar">
          <button onclick="filtrarVanos('TODOS')" class="bg-blue-600 text-white px-2.5 py-1.5 rounded-lg whitespace-nowrap">Todos</button>
          <button onclick="filtrarVanos('PENDIENTE')" class="bg-slate-800 text-slate-300 px-2.5 py-1.5 rounded-lg border border-slate-700 whitespace-nowrap">Pendientes</button>
          <button onclick="filtrarVanos('RESTOS')" class="bg-slate-800 text-slate-300 px-2.5 py-1.5 rounded-lg border border-slate-700 whitespace-nowrap">Restos</button>
          <button onclick="filtrarVanos('CERTIFICADO')" class="bg-slate-800 text-slate-300 px-2.5 py-1.5 rounded-lg border border-slate-700 whitespace-nowrap">Certificados</button>
        </div>

        <button onclick="toggleSeleccionarTodos()" class="text-xs font-semibold text-blue-400 hover:text-blue-300 whitespace-nowrap ml-2">
          <span id="txt-select-all">Marcar Todos</span>
        </button>
      </div>

      <div id="lista-vanos" class="space-y-2"></div>
    </section>

  </main>

  <!-- BARRA FLOTANTE -->
  <div id="barra-flotante" class="fixed bottom-4 left-4 right-4 max-w-lg mx-auto bg-slate-800 border border-slate-600 text-white p-3 rounded-2xl shadow-2xl flex items-center justify-between hidden z-30">
    <div class="flex items-center space-x-2">
      <span class="w-6 h-6 rounded-full bg-blue-600 text-xs font-bold flex items-center justify-center" id="count-seleccionados">0</span>
      <span class="text-xs font-semibold">Vanos marcados</span>
    </div>
    <button onclick="abrirModalEstado()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs py-2 px-3.5 rounded-xl flex items-center space-x-1.5 shadow-md">
      <i data-lucide="edit-2" class="w-4 h-4"></i>
      <span>Cambiar Estado</span>
    </button>
  </div>

  <!-- Modal Selector de Estado -->
  <div id="modal-estado" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-slate-800 border border-slate-700 w-full max-w-md rounded-t-2xl sm:rounded-2xl p-5 space-y-4 shadow-2xl">
      <div class="flex justify-between items-center border-b border-slate-700 pb-3">
        <div>
          <span class="text-xs text-blue-400 font-semibold uppercase">Seleccionar Nuevo Estado</span>
          <h3 id="modal-vano-title" class="text-base font-bold text-white">Vanos Seleccionados</h3>
        </div>
        <button onclick="cerrarModal()" class="text-slate-400 hover:text-white p-1">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <div class="grid grid-cols-1 gap-2 text-sm font-medium">
        <button onclick="aplicarEstadoLote('Poda Preventiva')" class="p-3 rounded-xl bg-emerald-950/60 border border-emerald-500/50 text-emerald-300 flex items-center justify-between hover:bg-emerald-900/50">
          <span class="flex items-center space-x-2.5">
            <span class="w-3 h-3 rounded-full bg-emerald-500"></span>
            <span>Poda Preventiva</span>
          </span>
        </button>

        <button onclick="aplicarEstadoLote('Poda Cerca')" class="p-3 rounded-xl bg-amber-950/60 border border-amber-500/50 text-amber-300 flex items-center justify-between hover:bg-amber-900/50">
          <span class="flex items-center space-x-2.5">
            <span class="w-3 h-3 rounded-full bg-amber-500"></span>
            <span>Poda Cerca</span>
          </span>
        </button>

        <button onclick="aplicarEstadoLote('Poda Muy Cerca')" class="p-3 rounded-xl bg-rose-950/60 border border-rose-500/50 text-rose-300 flex items-center justify-between hover:bg-rose-900/50">
          <span class="flex items-center space-x-2.5">
            <span class="w-3 h-3 rounded-full bg-rose-500"></span>
            <span>Poda Muy Cerca</span>
          </span>
        </button>

        <button onclick="aplicarEstadoLote('Poda en Altura')" class="p-3 rounded-xl bg-purple-950/60 border border-purple-500/50 text-purple-300 flex items-center justify-between hover:bg-purple-900/50">
          <span class="flex items-center space-x-2.5">
            <span class="w-3 h-3 rounded-full bg-purple-500"></span>
            <span>Poda en Altura</span>
          </span>
        </button>

        <button onclick="aplicarEstadoLote('Restos de Poda')" class="p-3 rounded-xl bg-orange-950/60 border border-orange-500/50 text-orange-300 flex items-center justify-between hover:bg-orange-900/50">
          <span class="flex items-center space-x-2.5">
            <i data-lucide="trash-2" class="w-4 h-4 text-orange-400"></i>
            <span>Restos de Poda</span>
          </span>
        </button>

        <button onclick="aplicarEstadoLote('Certificado')" class="p-3 rounded-xl bg-blue-600 text-white flex items-center justify-between hover:bg-blue-500 shadow-lg font-bold">
          <span class="flex items-center space-x-2.5">
            <i data-lucide="check-circle-2" class="w-5 h-5 text-emerald-300"></i>
            <span>Certificado</span>
          </span>
        </button>

        <button onclick="aplicarEstadoLote('Pendiente Certificacion')" class="p-3 rounded-xl bg-slate-700 text-slate-300 flex items-center justify-between hover:bg-slate-600">
          <span class="flex items-center space-x-2.5">
            <span class="w-3 h-3 rounded-full bg-slate-400"></span>
            <span>Pendiente Certificacion (Reiniciar)</span>
          </span>
        </button>
      </div>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbz0IMl0nAI7lY8rtjzImtL0_URi38BNl3EETrYz1XiPKWCrdMZiMpM_PG4kfoh53UQ4CQ/exec";

    let estadoApp = {
      zona: "",
      tramoSeleccionado: null,
      tramos: [],
      vanos: [],
      seleccionados: new Set(),
      filtroActual: "TODOS"
    };

    document.addEventListener("DOMContentLoaded", async () => {
      lucide.createIcons();
      registrarServiceWorker();
      verificarConexion();
      window.addEventListener('online', verificarConexion);
      window.addEventListener('offline', verificarConexion);

      await cargarZonas();
      document.getElementById("btn-back").addEventListener("click", volverATramos);
    });

    function registrarServiceWorker() {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('Service Worker registrado con éxito'))
          .catch(err => console.log('Error al registrar Service Worker', err));
      }
    }

    function verificarConexion() {
      const badge = document.getElementById("offline-badge");
      if (!navigator.onLine) {
        badge.classList.remove("hidden");
      } else {
        badge.classList.add("hidden");
      }
    }

    // Carga de Zonas con soporte offline (localStorage)
    async function cargarZonas() {
      const selectZona = document.getElementById("select-zona");
      selectZona.innerHTML = `<option value="">Cargando zonas...</option>`;

      try {
        const resp = await fetch(`${API_URL}?action=getZonas`);
        const data = await resp.json();

        if (data.success && data.zonas && data.zonas.length > 0) {
          localStorage.setItem("cache_zonas", JSON.stringify(data.zonas));
          poblarSelectZonas(data.zonas);
        } else {
          cargarZonasOffline();
        }
      } catch (e) {
        cargarZonasOffline();
      }
    }

    function cargarZonasOffline() {
      const cache = localStorage.getItem("cache_zonas");
      if (cache) {
        const zonas = JSON.parse(cache);
        poblarSelectZonas(zonas);
      } else {
        document.getElementById("select-zona").innerHTML = `<option value="">Sin conexión y sin caché local</option>`;
      }
    }

    function poblarSelectZonas(zonas) {
      const selectZona = document.getElementById("select-zona");
      selectZona.innerHTML = "";
      zonas.forEach(zona => {
        const opt = document.createElement("option");
        opt.value = zona;
        opt.innerText = zona;
        selectZona.appendChild(opt);
      });
      estadoApp.zona = zonas[0];
      cargarTramos();
    }

    // Carga de Tramos con soporte offline
    async function cargarTramos() {
      const zona = document.getElementById("select-zona").value;
      if (!zona) return;
      estadoApp.zona = zona;
      const contenedor = document.getElementById("lista-tramos");
      contenedor.innerHTML = `<div class="p-8 text-center text-slate-500 text-sm">Cargando tramos...</div>`;

      try {
        const resp = await fetch(`${API_URL}?action=getTramos&zona=${encodeURIComponent(zona)}`);
        const data = await resp.json();

        if (data.success) {
          localStorage.setItem(`cache_tramos_${zona}`, JSON.stringify(data.tramos));
          renderTramos(data.tramos);
        } else {
          cargarTramosOffline(zona);
        }
      } catch (e) {
        cargarTramosOffline(zona);
      }
    }

    function cargarTramosOffline(zona) {
      const cache = localStorage.getItem(`cache_tramos_${zona}`);
      if (cache) {
        const tramos = JSON.parse(cache);
        document.getElementById("count-tramos").innerText = tramos.length;
        renderTramos(tramos);
      } else {
        document.getElementById("lista-tramos").innerHTML = `<div class="p-4 bg-amber-950/50 text-amber-200 rounded-xl text-center text-xs">Sin conexión. No hay datos en caché para esta zona.</div>`;
      }
    }

    function renderTramos(tramos) {
      const contenedor = document.getElementById("lista-tramos");
      contenedor.innerHTML = "";
      document.getElementById("count-tramos").innerText = tramos.length;

      tramos.forEach(t => {
        const pct = Math.round((t.certificados / t.totalVanos) * 100) || 0;
        const item = document.createElement("div");
        item.className = "bg-slate-800 border border-slate-700 hover:border-blue-500/50 rounded-2xl p-4 shadow-md cursor-pointer space-y-3";
        item.onclick = () => abrirTramo(t);

        item.innerHTML = `
          <div class="flex justify-between items-start">
            <div>
              <span class="text-[10px] font-bold text-blue-400 uppercase">Tramo ${t.tramo}</span>
              <h3 class="text-sm font-bold text-white">${t.linea}</h3>
            </div>
            <i data-lucide="chevron-right" class="w-5 h-5 text-slate-500"></i>
          </div>

          <div class="space-y-1">
            <div class="flex justify-between text-xs text-slate-400">
              <span>${t.certificados} de ${t.totalVanos} vanos</span>
              <span class="font-semibold text-white">${pct}%</span>
            </div>
            <div class="w-full bg-slate-700 h-2 rounded-full overflow-hidden">
              <div class="bg-emerald-500 h-full" style="width: ${pct}%"></div>
            </div>
          </div>
        `;
        contenedor.appendChild(item);
      });
      lucide.createIcons();
    }

    async function abrirTramo(tramoObj) {
      estadoApp.tramoSeleccionado = tramoObj;
      estadoApp.seleccionados.clear();
      document.getElementById("vista-tramos").classList.add("hidden");
      document.getElementById("vista-vanos").classList.remove("hidden");
      document.getElementById("btn-back").classList.remove("hidden");

      document.getElementById("tramo-linea-tag", "").innerText = `TRAMO ${tramoObj.tramo}`;
      document.getElementById("tramo-titulo").innerText = tramoObj.linea;

      await cargarVanos();
      await cargarAccesosLinea(tramoObj.linea);
    }

    function volverATramos() {
      document.getElementById("vista-vanos").classList.add("hidden");
      document.getElementById("vista-tramos").classList.remove("hidden");
      document.getElementById("btn-back").classList.add("hidden");
      cargarTramos();
    }

    function toggleSeccionAccesos() {
      const contenedor = document.getElementById("contenedor-accesos");
      const icono = document.getElementById("icono-toggle-accesos");
      contenedor.classList.toggle("hidden");
      icono.classList.toggle("rotate-180");
    }

    // Carga de Accesos y OT con soporte offline
    async function cargarAccesosLinea(lineaNombre) {
      const contenedorAccesos = document.getElementById("lista-accesos-contenido");
      contenedorAccesos.innerHTML = `<p class="text-slate-500 italic">Buscando datos de accesos y OT...</p>`;

      try {
        const resp = await fetch(`${API_URL}?action=getAccesos&linea=${encodeURIComponent(lineaNombre)}`);
        const data = await resp.json();

        if (data.success) {
          localStorage.setItem(`cache_accesos_${lineaNombre}`, JSON.stringify(data));
          renderAccesosYOT(data);
        } else {
          cargarAccesosOffline(lineaNombre);
        }
      } catch (e) {
        cargarAccesosOffline(lineaNombre);
      }
    }

    function cargarAccesosOffline(lineaNombre) {
      const cache = localStorage.getItem(`cache_accesos_${lineaNombre}`);
      if (cache) {
        const data = JSON.parse(cache);
        renderAccesosYOT(data);
      } else {
        document.getElementById("lista-accesos-contenido").innerHTML = `<p class="text-amber-400 text-xs italic">Sin conexión y sin datos de accesos en caché para esta línea.</p>`;
      }
    }

    function renderAccesosYOT(data) {
      const contenedorAccesos = document.getElementById("lista-accesos-contenido");
      let html = "";

      if (data.linkOT) {
        html += `
          <div class="bg-blue-950/60 border border-blue-500/50 rounded-xl p-3 flex items-center justify-between mb-3 shadow">
            <div class="flex items-center space-x-2 text-blue-300 font-bold">
              <i data-lucide="file-text" class="w-4 h-4"></i>
              <span>Orden de Trabajo (OT)</span>
            </div>
            <a href="${data.linkOT}" target="_blank" class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1.5 rounded-lg text-xs font-bold flex items-center space-x-1">
              <span>Ver PDF / OT</span>
              <i data-lucide="external-link" class="w-3 h-3"></i>
            </a>
          </div>
        `;
      }

      if (data.accesos && data.accesos.length > 0) {
        data.accesos.forEach((acc) => {
          html += `
            <div class="bg-slate-900/60 border border-slate-700/60 rounded-xl p-3 space-y-2">
              <div class="flex justify-between items-center text-amber-300 font-bold border-b border-slate-800 pb-1">
                <span>Vanos: ${acc.vanoInicio || '-'} al ${acc.vanoFin || '-'}</span>
                <span class="bg-amber-950 px-2 py-0.5 rounded text-[10px]">Candado N° ${acc.candado || 'S/N'}</span>
              </div>
              <div class="grid grid-cols-1 gap-1 text-slate-300">
                <div><strong class="text-slate-400">Campo:</strong> ${acc.campo || '-'}</div>
                ${acc.dueno ? `
                  <div class="flex items-center justify-between">
                    <span><strong class="text-slate-400">Dueño:</strong> ${acc.dueno}</span>
                    ${acc.telDueno ? `<a href="tel:${acc.telDueno}" class="bg-emerald-950 text-emerald-300 hover:bg-emerald-900 px-2.5 py-1 rounded-lg text-xs font-semibold flex items-center space-x-1"><i data-lucide="phone" class="w-3 h-3"></i><span>Llamar</span></a>` : ''}
                  </div>` : ''}
                ${acc.encargado ? `
                  <div class="flex items-center justify-between">
                    <span><strong class="text-slate-400">Encargado:</strong> ${acc.encargado}</span>
                    ${acc.telEncargado ? `<a href="tel:${acc.telEncargado}" class="bg-emerald-950 text-emerald-300 hover:bg-emerald-900 px-2.5 py-1 rounded-lg text-xs font-semibold flex items-center space-x-1"><i data-lucide="phone" class="w-3 h-3"></i><span>Llamar</span></a>` : ''}
                  </div>` : ''}
                ${acc.observaciones ? `<div class="text-[11px] text-slate-400 italic pt-1 border-t border-slate-800"><strong class="text-slate-300">Obs:</strong> ${acc.observaciones}</div>` : ''}
              </div>
            </div>
          `;
        });
      } else if (!data.linkOT) {
        html += `<p class="text-slate-500 italic">No hay registros de accesos ni OT configurados para esta línea.</p>`;
      }

      contenedorAccesos.innerHTML = html;
      lucide.createIcons();
    }

    // Carga de Vanos con soporte offline
    async function cargarVanos() {
      const contenedor = document.getElementById("lista-vanos");
      contenedor.innerHTML = `<div class="p-8 text-center text-slate-500 text-sm">Cargando vanos...</div>`;
      const cacheKey = `cache_vanos_${estadoApp.zona}_${estadoApp.tramoSeleccionado.tramo}`;

      try {
        const resp = await fetch(`${API_URL}?action=getVanos&zona=${encodeURIComponent(estadoApp.zona)}&tramo=${estadoApp.tramoSeleccionado.tramo}`);
        const data = await resp.json();

        if (data.success) {
          localStorage.setItem(cacheKey, JSON.stringify(data.vanos));
          estadoApp.vanos = data.vanos;
          actualizarProgresoTramo();
          renderVanos();
        } else {
          cargarVanosOffline(cacheKey);
        }
      } catch (e) {
        cargarVanosOffline(cacheKey);
      }
    }

    function cargarVanosOffline(cacheKey) {
      const cache = localStorage.getItem(cacheKey);
      if (cache) {
        estadoApp.vanos = JSON.parse(cache);
        actualizarProgresoTramo();
        renderVanos();
      } else {
        document.getElementById("lista-vanos").innerHTML = `<div class="p-4 bg-rose-950/50 text-rose-200 rounded-xl text-center text-xs">Sin conexión. No hay datos de vanos en caché para este tramo.</div>`;
      }
    }

    function actualizarProgresoTramo() {
      const total = estadoApp.vanos.length;
      const certificados = estadoApp.vanos.filter(v => v.estado === "Certificado").length;
      const pct = Math.round((certificados / total) * 100) || 0;

      document.getElementById("bar-certificados").style.width = `${pct}%`;
      document.getElementById("tramo-progreso-txt").innerText = `${pct}% (${certificados}/${total})`;
    }

    function renderVanos() {
      const contenedor = document.getElementById("lista-vanos");
      contenedor.innerHTML = "";

      let lista = estadoApp.vanos;
      if (estadoApp.filtroActual === "PENDIENTE") lista = lista.filter(v => v.estado !== "Certificado" && v.estado !== "Restos de Poda");
      if (estadoApp.filtroActual === "RESTOS") lista = lista.filter(v => v.estado === "Restos de Poda");
      if (estadoApp.filtroActual === "CERTIFICADO") lista = lista.filter(v => v.estado === "Certificado");

      lista.forEach(v => {
        const isChecked = estadoApp.seleccionados.has(v.vano);
        const badge = getBadgeEstado(v.estado);
        const item = document.createElement("div");
        item.className = `bg-slate-800/80 border ${isChecked ? 'border-blue-500 bg-blue-950/20' : 'border-slate-700/80'} rounded-xl p-3 flex items-center justify-between cursor-pointer transition`;
        item.onclick = (e) => {
          if (e.target.tagName !== 'INPUT') {
            toggleSeleccionVano(v.vano);
          }
        };

        item.innerHTML = `
          <div class="flex items-center space-x-3">
            <input type="checkbox" ${isChecked ? 'checked' : ''} onchange="toggleSeleccionVano('${v.vano}')" class="w-4 h-4 accent-blue-600 rounded cursor-pointer">
            <div class="w-8 h-8 rounded-lg bg-slate-700 flex items-center justify-center font-bold text-xs text-white">
              ${v.vano}
            </div>
            <div>
              <div class="text-xs font-bold text-white">Vano ${v.vano}</div>
              <div class="mt-0.5">${badge}</div>
            </div>
          </div>
          <div class="text-right">
            ${v.fechaCertificado ? `<span class="text-[10px] text-emerald-400 font-semibold block">${v.fechaCertificado}</span>` : ''}
          </div>
        `;
        contenedor.appendChild(item);
      });

      const btnTxt = document.getElementById("txt-select-all");
      if (estadoApp.seleccionados.size > 0 && estadoApp.seleccionados.size === estadoApp.vanos.length) {
        btnTxt.innerText = "Desmarcar Todos";
      } else {
        btnTxt.innerText = "Marcar Todos";
      }

      actualizarBarraFlotante();
      lucide.createIcons();
    }

    function toggleSeleccionVano(vano) {
      if (estadoApp.seleccionados.has(vano)) {
        estadoApp.seleccionados.delete(vano);
      } else {
        estadoApp.seleccionados.add(vano);
      }
      renderVanos();
    }

    function toggleSeleccionarTodos() {
      if (estadoApp.seleccionados.size === estadoApp.vanos.length) {
        estadoApp.seleccionados.clear();
      } else {
        estadoApp.vanos.forEach(v => estadoApp.seleccionados.add(v.vano));
      }
      renderVanos();
    }

    function actualizarBarraFlotante() {
      const cant = estadoApp.seleccionados.size;
      const barra = document.getElementById("barra-flotante");
      if (cant > 0) {
        document.getElementById("count-seleccionados").innerText = cant;
        barra.classList.remove("hidden");
      } else {
        barra.classList.add("hidden");
      }
    }

    function getBadgeEstado(estado) {
      switch (estado) {
        case "Poda Preventiva": return `<span class="px-2 py-0.5 rounded text-[10px] font-semibold bg-emerald-950 text-emerald-300">🟢 Preventiva</span>`;
        case "Poda Cerca": return `<span class="px-2 py-0.5 rounded text-[10px] font-semibold bg-amber-950 text-amber-300">🟡 Cerca</span>`;
        case "Poda Muy Cerca": return `<span class="px-2 py-0.5 rounded text-[10px] font-semibold bg-rose-950 text-rose-300">🔴 Muy Cerca</span>`;
        case "Poda en Altura": return `<span class="px-2 py-0.5 rounded text-[10px] font-semibold bg-purple-950 text-purple-300">🟣 En Altura</span>`;
        case "Restos de Poda": return `<span class="px-2 py-0.5 rounded text-[10px] font-semibold bg-orange-950 text-orange-300">🧹 Restos de Poda</span>`;
        case "Certificado": return `<span class="px-2 py-0.5 rounded text-[10px] font-semibold bg-blue-950 text-blue-300">✅ Certificado</span>`;
        default: return `<span class="px-2 py-0.5 rounded text-[10px] font-semibold bg-slate-700 text-slate-300">⚪ Pendiente Certificacion</span>`;
      }
    }

    function abrirModalEstado() {
      document.getElementById("modal-vano-title").innerText = `${estadoApp.seleccionados.size} Vanos Marcados`;
      document.getElementById("modal-estado").classList.remove("hidden");
    }

    function cerrarModal() {
      document.getElementById("modal-estado").classList.add("hidden");
    }

    function aplicarEstadoLote(nuevoEstado) {
      cerrarModal();

      estadoApp.vanos.forEach(v => {
        if (estadoApp.seleccionados.has(v.vano)) {
          v.estado = nuevoEstado;
        }
      });

      estadoApp.seleccionados.clear();
      actualizarProgresoTramo();
      renderVanos();
    }

    async function actualizarTramoServidor() {
      const btn = document.getElementById("btn-actualizar-tramo");
      btn.disabled = true;
      btn.innerText = "Guardando en Google Sheets...";

      const vanosPayload = estadoApp.vanos.map(v => ({
        vano: String(v.vano),
        estado: String(v.estado)
      }));

      try {
        const resp = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            action: "actualizarTramoBatch",
            zona: estadoApp.zona,
            tramo: String(estadoApp.tramoSeleccionado.tramo),
            vanos: vanosPayload
          })
        });

        const res = await resp.json();
        if (res.success) {
          alert(`¡Éxito! Se guardaron correctamente los datos en Google Sheets.`);
          await cargarVanos();
        } else {
          alert(`Error del servidor: ${res.message || 'No se pudo guardar'}`);
        }
      } catch (e) {
        alert("Sin conexión a internet. No se pudo sincronizar con la hoja de Google Sheets en este momento.");
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<i data-lucide="save" class="w-5 h-5"></i><span>ACTUALIZAR TRAMO EN HOJA</span>`;
        lucide.createIcons();
      }
    }

    function filtrarVanos(tipo) {
      estadoApp.filtroActual = tipo;
      renderVanos();
    }

    function cargarDatosActuales() {
      if (!document.getElementById("vista-vanos").classList.contains("hidden")) {
        cargarVanos();
        if (estadoApp.tramoSeleccionado) cargarAccesosLinea(estadoApp.tramoSeleccionado.linea);
      } else {
        cargarZonas();
      }
    }
  </script>
</body>
</html>
